# pre-commit hooks for fin-auto-dcf — Phase 0 scaffolding.
#
# Install once in a clone (requires `pip install pre-commit`):
#   pre-commit install
#
# Zero third-party deps: the hook runs a stdlib-only Python script, so it
# also works without pre-commit via:
#   python scripts/check_license_header.py            # whole repo
#   python scripts/check_license_header.py <files>    # specific files
repos:
  - repo: local
    hooks:
      - id: license-header
        name: Apache-2.0 license header (copyright + SPDX)
        entry: python scripts/check_license_header.py
        language: system
        files: \.(py|sh|bash|toml)$
        pass_filenames: true
